# Replay recorded REAL telemetry (archive folder or ingestion .db) through ML,
# safety review and the decision view. Controller runs in review mode: no actuation.
#   REPLAY_SOURCE=/abs/path/to/data/ml-archive demo/run.sh replay
name: adaptivenet-demo-replay

x-image: &image
  build:
    context: ..
    dockerfile: demo/Dockerfile
  image: adaptivenet-demo:local
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-env: &env
  DEMO_DATA_DIR: /app/data
  ML_URL: http://ml:8000

services:
  replay:
    <<: *image
    command: ["python", "-m", "demo.replay", "--source", "/replay-source", "--out", "/app/data",
              "--speed", "${REPLAY_SPEED:-1}"]
    environment: {REPLAY_START_AT: "${REPLAY_START_AT:-}", REPLAY_MAX_GAP: "${REPLAY_MAX_GAP:-120}"}
    volumes:
      - "${REPLAY_SOURCE:?set REPLAY_SOURCE to an archive folder or .db}:/replay-source:ro"
      - "${DEMO_REPLAY_DATA_HOST:-../data/demo-replay}:/app/data"
  ml:
    <<: *image
    restart: unless-stopped
    command: ["uvicorn", "demo.lab.ml_service:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: {<<: *env, ADAPTIVENET_SHADOW_MODEL: "${ADAPTIVENET_SHADOW_MODEL:-}", DEMO_MODELS_DIR: "${DEMO_MODELS_DIR:-}"}
    volumes:
      - "${DEMO_REPLAY_DATA_HOST:-../data/demo-replay}:/app/data"
      - "${DEMO_MODELS_HOST:-../data/demo-models}:/app/models:ro"
    ports: ["127.0.0.1:8192:8000"]
  controller:
    <<: *image
    restart: unless-stopped
    command: ["python", "-m", "demo.lab.controller"]
    environment: {<<: *env, DEMO_CONTROLLER_MODE: review, DEMO_DECISION_GROUP: "${DEMO_DECISION_GROUP:-aws_ripe_http}"}
    volumes: ["${DEMO_REPLAY_DATA_HOST:-../data/demo-replay}:/app/data"]
    depends_on: [ml]
  view:
    <<: *image
    restart: unless-stopped
    command: ["uvicorn", "demo.lab.view:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: {<<: *env, DEMO_MODE: replay_recorded_data}
    volumes: ["${DEMO_REPLAY_DATA_HOST:-../data/demo-replay}:/app/data"]
    ports: ["127.0.0.1:8190:8000"]
    depends_on: [ml]
