# TEMPLATE ONLY: requires team-approved immutable ECR image digest and a
# pre-provisioned Kubernetes secret adaptivenet-shadow-ml-token/token.
# Do not apply without infrastructure owner review.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adaptivenet-shadow-ml
  namespace: adaptivenet
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adaptivenet-shadow-ml
  namespace: adaptivenet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adaptivenet-shadow-ml
  template:
    metadata:
      labels:
        app: adaptivenet-shadow-ml
    spec:
      serviceAccountName: adaptivenet-shadow-ml
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shadow-inference
          image: REPLACE_WITH_TEAM_APPROVED_ECR_IMAGE_AT_SHA256_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: ADAPTIVENET_SHADOW_BIND
              value: 0.0.0.0
            - name: ADAPTIVENET_SHADOW_PORT
              value: "8090"
            - name: ADAPTIVENET_SHADOW_TOKEN
              valueFrom:
                secretKeyRef:
                  name: adaptivenet-shadow-ml-token
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: adaptivenet-shadow-ml
  namespace: adaptivenet
spec:
  type: ClusterIP
  selector:
    app: adaptivenet-shadow-ml
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adaptivenet-shadow-ml-ingress
  namespace: adaptivenet
spec:
  podSelector:
    matchLabels:
      app: adaptivenet-shadow-ml
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              # Infra teammate must confirm the real producer pod label.
              app: adaptivenet-feature-worker
      ports:
        - protocol: TCP
          port: 8090
  egress: []
