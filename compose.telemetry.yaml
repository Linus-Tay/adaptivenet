# Optional Docker runtime for REAL SQS telemetry. Not the isolated fault lab.
# Required: export ADAPTIVENET_UID="$(id -u)" ADAPTIVENET_GID="$(id -g)".
# Required: authenticate AWS SSO on the Mac; its cache is mounted read-only.
# DO NOT simultaneously launch native live_monitor.py --sqs.
name: adaptivenet-telemetry
x-common: &common
  build:
    context: .
    dockerfile: Dockerfile.telemetry
  user: "${ADAPTIVENET_UID:?Set ADAPTIVENET_UID from id -u}:${ADAPTIVENET_GID:?Set ADAPTIVENET_GID from id -g}"
  environment:
    AWS_PROFILE: "${AWS_PROFILE:-adaptivenet-admin}"
    AWS_DEFAULT_REGION: ap-southeast-1
    AWS_REGION: ap-southeast-1
    AWS_EC2_METADATA_DISABLED: "true"
    AWS_CONFIG_FILE: /home/telemetry/.aws/config
    AWS_SHARED_CREDENTIALS_FILE: /home/telemetry/.aws/credentials
    HOME: /home/telemetry
  volumes:
    - "${HOME:?HOME is required}/.aws:/home/telemetry/.aws:ro"
    - "./.env:/app/.env:ro"
    - "./data:/app/data"
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

services:
  collector:
    <<: *common
    command: ["python", "scripts/sqs_ingestion.py", "publish-watch", "--interval", "60"]
  feature-worker:
    <<: *common
    command: ["python", "scripts/sqs_ingestion.py", "consume-watch"]
