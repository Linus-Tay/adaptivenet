# Least privilege: the controller may only read and patch Deployment scale in its namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adaptivenet-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: adaptivenet-scaler
rules:
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [demo-a, demo-b]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: adaptivenet-scaler
subjects:
  - kind: ServiceAccount
    name: adaptivenet-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: adaptivenet-scaler
