name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: pytest -q
      - run: python scripts/smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
  infrastructure-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate without cloud credentials
        run: |
          for directory in infra/terraform/bootstrap infra/terraform/environments/dev; do
            terraform -chdir="$directory" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$directory" validate
          done
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: helm lint infra/helm/demo && helm template demo infra/helm/demo > /tmp/demo.yaml
  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - name: services
            dockerfile: Dockerfile
          - name: dashboard
            dockerfile: apps/Dockerfile
          - name: demo-web
            dockerfile: apps/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: APP=${{ matrix.name }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
