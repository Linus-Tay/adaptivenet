name: Publish images
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: images-main
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      vars.AWS_READY == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: services
            dockerfile: Dockerfile
          - name: dashboard
            dockerfile: apps/Dockerfile
          - name: demo-web
            dockerfile: apps/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Immutable image tag
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IMAGES_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Verify AWS account
        env:
          EXPECTED_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "$EXPECTED_ACCOUNT"
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Check whether this commit is already published
        id: existing
        env:
          REPOSITORY: adaptivenet/${{ matrix.name }}
          IMAGE_TAG: ${{ steps.revision.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" > /dev/null 2> /tmp/ecr-error; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif grep -q ImageNotFoundException /tmp/ecr-error; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat /tmp/ecr-error >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.exists == 'false'
      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.exists == 'false'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: APP=${{ matrix.name }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/adaptivenet/${{ matrix.name }}:${{ steps.revision.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
      - name: Record published digest
        env:
          REPOSITORY: adaptivenet/${{ matrix.name }}
          IMAGE_TAG: ${{ steps.revision.outputs.sha }}
        run: |
          aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text >> "$GITHUB_STEP_SUMMARY"
